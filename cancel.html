<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trama | Checkout Cancelado</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="main">
    <div class="header">
      <div class="badge">Cancelado</div>
      <h1 class="title">Checkout cancelado</h1>
    </div>
    <p class="lead">Nenhuma cobranca foi efetuada. Podes retomar a compra quando quiseres.</p>

    <section class="card section">
      <h2>Como continuar</h2>
      <ul class="list-check">
        <li><span class="check"></span><span>Tenta novamente pelo ecra Premium na app.</span></li>
        <li><span class="check"></span><span>Verifica se o metodo de pagamento esta atualizado.</span></li>
        <li><span class="check"></span><span>Precisas de ajuda? support@sportstrama.com</span></li>
      </ul>
      <div class="cta-row">
        <a class="btn btn-primary" href="sportstrama://premium">Voltar para a app</a>
        <a class="btn btn-secondary" href="/pricing.html">Rever planos</a>
      </div>
    </section>
  </main>
</body>
</html>
